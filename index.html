<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badger recipe collection</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Left Navigation Accordion / Sidebar -->
  <aside>
    <div class="sidebar-header">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRQZI4IggFotmYhSMmAl55CSIkO2ac-aXnxtUlkXFDdeOqUmTkIJBl1KY&s=10" alt="Badger Face" class="badger-avatar">
      <div class="sidebar-title-group">
        <h2>Badger Recipe Collection</h2>
        <span class="sidebar-count" id="sidebarCount">Loading recipes...</span>
        <div class="search-action-bar">
          <input type="text" id="searchInput" placeholder="Search recipes..." aria-label="Search recipes" oninput="filterRecipes()">
        </div>
      </div>
    </div>
    <div class="nav-list" id="navList"></div>
  </aside>

  <!-- Main Content Workspace -->
  <main>
    <div class="content-body">
      <div class="recipe-list" id="recipeContainer"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
