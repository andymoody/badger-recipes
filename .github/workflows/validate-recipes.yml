name: Validate recipes and test

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Validate recipes
        run: node build.js --check
      - name: Unit tests
        run: node --test 'tests/*.test.mjs'
