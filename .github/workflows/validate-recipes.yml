name: Validate recipes and test

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the old collection (commit 4623299) is read by tools/old-recipe.mjs and its test
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Validate recipes
        run: node build.js --check
      - name: Unit and browser tests
        run: node --test 'tests/*.test.mjs'
        env:
          CHROME_PATH: /usr/bin/google-chrome
