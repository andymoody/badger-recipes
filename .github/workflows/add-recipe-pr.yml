name: Auto Create Recipe PR from Issue

on:
  issues:
    types: [opened]

jobs:
  create-recipe-pr:
    if: contains(github.event.issue.labels.*.name, 'new-recipe') || startsWith(github.event.issue.title, '[New Recipe]:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/coordinator/setup-node@v4
        with:
          node-version: '18'

      - name: Append Recipe to recipes.json
        id: parse_recipe
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueBody = context.payload.issue.body;
            
            // Extract JSON code block from issue body
            const jsonMatch = issueBody.match(/```json\s*([\s\S]*?)\s*```/);
            if (!jsonMatch) {
              core.setFailed('Could not find JSON payload in the issue body.');
              return;
            }
            
            const newRecipe = JSON.parse(jsonMatch[1]);
            const filePath = './recipes.json';
            
            // Read and parse current recipes.json
            const rawData = fs.readFileSync(filePath, 'utf8');
            const recipes = JSON.parse(rawData);
            
            // Append new recipe
            recipes.push(newRecipe);
            
            // Save updated JSON
            fs.writeFileSync(filePath, JSON.stringify(recipes, null, 2) + '\n');
            core.setOutput('recipe_title', newRecipe.title);

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "feat: add ${{ steps.parse_recipe.outputs.recipe_title }} recipe"
          title: "Add Recipe: ${{ steps.parse_recipe.outputs.recipe_title }}"
          body: "Automated PR generated from Issue #${{ github.event.issue.number }}."
          branch: "add-recipe-${{ github.event.issue.number }}"
          delete-branch: true
